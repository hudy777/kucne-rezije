name: Izgradi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instaliraj pakete i pripremi aplikaciju
        run: |
          npm ci
          npm run build

      - name: Izgradi APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../kucne-rezije.apk

      - name: Objavi APK za preuzimanje
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Kućne režije 1.${{ github.run_number }}
          files: kucne-rezije.apk
          make_latest: true
