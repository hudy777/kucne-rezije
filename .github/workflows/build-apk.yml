name: Izgradi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instaliraj pakete i pripremi aplikaciju
        run: |
          npm ci
          npm run build

      - name: Pripremi stranicu za automatska ažuriranja
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Izgradi APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../kucne-rezije.apk

      - name: Spremi zapisnik greške
        if: failure()
        shell: bash
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          tail -n 300 build.log > /tmp/build-log.txt || echo "nema zapisnika" > /tmp/build-log.txt
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          cp /tmp/build-log.txt build-log.txt
          git add build-log.txt
          git commit -m "Zapisnik neuspjele izgradnje ${{ github.run_number }}"
          git push -f origin build-log

      - name: Objavi APK za preuzimanje
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Kućne režije 1.${{ github.run_number }}
          files: kucne-rezije.apk
          make_latest: true

  # The installed app loads the newest page from here, so most changes need no new APK
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
